services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend-api:
    build:
      context: ./apps/backend-api
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://inventory:inventory@postgres:5432/inventory
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./apps/frontend
    depends_on:
      - backend-api
    ports:
      - "3000:80"

volumes:
  postgres_data:
